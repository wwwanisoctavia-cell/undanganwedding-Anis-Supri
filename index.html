<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Undangan Pernikahan</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap');
    @import url('https://db.onlinewebfonts.com/c/4f88f680537c8291217f919f524d67d7?family=MaryKate');

    /* 1. PENGATURAN DASAR */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y proximity;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body {
      font-family: sans-serif;
      background: #fff;
      color: #222;
      overflow-x: hidden;
      -webkit-text-size-adjust: none;
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 2. STRUKTUR SECTION */
    .page {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
      background: #eee;
      scroll-snap-align: start;
    }

    /* 3. BACKGROUND GAMBAR DAN VIDEO */
    .bg-image,
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    /* 4. COVER */
    .cover-button {
      position: relative;
      z-index: 2;
      top: 43vh;
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #BFDCFC;
      color: #222;
      text-decoration: none;
    }

    #cover .nama-undangan {
      position: absolute;
      z-index: 2;
      top: 78%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: #3d6180;
    }

    #cover .nama-undangan p {
      font-family: 'Caveat', cursive;
      font-size: 16px;
      margin-bottom: 2px;
    }

    #cover .nama-undangan h2 {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      font-weight: 500;
    }

    /* 5. LOKASI DAN COUNTDOWN */
    .event-info {
      margin-top: -10px;
      line-height: 1.8;
    }

    #lokasi-countdown .event-info p {
      position: relative;
      top: -20px;
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #3d6180;
    }

    .location-button {
      display: inline-block;
      margin-top: 2px;
      padding: 3px 8px;
      background: #BFDCFC;
      color: #222;
      border: 1px solid #555;
      border-radius: 6px;
      text-decoration: none;
    }

    .countdown-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 90px;
    }

    .countdown-item {
      min-width: 58px;
      padding: 10px 6px;
      border: 1px solid #777;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.85);
    }

    .countdown-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .countdown-label {
      display: block;
      margin-top: 4px;
      font-size: 12px;
    }

    #status-acara {
      margin-top: 18px;
      line-height: 1.6;
    }

    /* 6. GIFT */
    #gift > .content {
  position: relative;
  top: 60px;
}

    .gift-button {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      background: #BFDCFC;
      color: #222;
      border: 1px solid #555;
      border-radius: 6px;
    }

    .gift-info {
      margin-top: 16px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    /* 7. TOMBOL MUSIK */
    .music-button {
  position: absolute;
  z-index: 101;
  top: 10%;
  left: 62%;
  transform: translateX(-50%);
  width: 36px;
  height: 36px;
  border: 1px solid #ddd;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
}

    /* 8. NAVIGASI BAWAH */
    .bottom-nav {
      display: none;
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
    }

    .nav-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
    }

    .nav-icon {
      font-size: 25px;
      color: #3d6180;
    }

    /* FONT TOMBOL */
    .cover-button,
.location-button,
.gift-button {
  font-family: Georgia, serif !important;
  font-weight: 600;
  font-size: 14px;
  color: #3d6180;
}

    /* LAYAR HP KECIL */
    @media (max-width: 360px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .countdown-container {
        gap: 5px;
      }

      .countdown-item {
        min-width: 52px;
      }

      .countdown-number {
        font-size: 19px;
      }

      .bottom-nav {
        gap: 4px;
      }
    }

    /* KUNCI SCROLL SEBELUM UNDANGAN DIBUKA */
    body.cover-terkunci {
      overflow: hidden;
      height: 100vh;
    }
 @keyframes munculDariBawah {
  from {
    opacity: 0;
    transform: translateY(35px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.page.muncul .bg-image,
.page.muncul .bg-video {
  animation: munculDariBawah 1.2s ease both;
}

.page.muncul .content {
  animation: munculDariBawah 1.5s ease both;
}
  </style>
</head>

<body>

  <!-- SECTION 1: COVER - 1.jpg -->
  <section class="page" id="cover">

    <img class="bg-image" src="1.jpg" alt="Cover undangan">

    <div class="content">
      <button class="cover-button" type="button"
        onclick="bukaUndangan()">
        Buka Undangan
      </button>
    </div>

    <div class="nama-undangan">
      <p>Dear,</p>
      <h2 id="nama-tamu">Tamu Undangan</h2>
    </div>

  </section>


  <!-- SECTION 2: VIDEO - 2.mp4 -->
  <section class="page" id="section-2">

    <video class="bg-video" autoplay muted loop playsinline>
      <source src="2.mp4" type="video/mp4">
    </video>
<button class="music-button" id="tombol-musik"
  type="button" onclick="toggleMusik()"
  aria-label="Putar musik" aria-pressed="false">
  <span id="ikon-musik">▶</span>
</button>
    
  </section>


  <!-- SECTION 3: GAMBAR - 3.jpg -->
  <section class="page" id="section-3">

    <img class="bg-image" src="3.jpg" alt="">

  </section>


  <!-- SECTION 4: GAMBAR - 4.jpg -->
  <section class="page" id="section-4">

    <img class="bg-image" src="4.jpg" alt="">

  </section>


  <!-- SECTION 5: LOKASI DAN COUNTDOWN - 5.jpg -->
  <section class="page" id="lokasi-countdown">

    <img class="bg-image" src="5.jpg" alt="">

    <div class="content">

      <div class="event-info">
        <p>Selasa, 8 Desember 2026</p>
        <p>Pukul 09.00 WIB</p>
        <p>Desa Randu, Pecalungan</p>

        <a class="location-button"
          href="https://maps.app.goo.gl/cLHLugiaV9WezTDn7?g_st=ic"
          target="_blank"
          rel="noopener noreferrer">
          📍 Lihat Lokasi
        </a>
      </div>

      <div class="countdown-container">

        <div class="countdown-item">
          <span class="countdown-number" id="hari">0</span>
          <span class="countdown-label">Hari</span>
        </div>

        <div class="countdown-item">
          <span class="countdown-number" id="jam">00</span>
          <span class="countdown-label">Jam</span>
        </div>

        <div class="countdown-item">
          <span class="countdown-number" id="menit">00</span>
          <span class="countdown-label">Menit</span>
        </div>

        <div class="countdown-item">
          <span class="countdown-number" id="detik">00</span>
          <span class="countdown-label">Detik</span>
        </div>

      </div>

    </div>

  </section>


  <!-- SECTION 6: GAMBAR - 6.jpg -->
  <section class="page" id="section-6">

    <img class="bg-image" src="6.jpg" alt="">

  </section>


  <!-- SECTION 7: GIFT - 7.jpg -->
  <section class="page" id="gift">

    <img class="bg-image" src="7.jpg" alt="">

    <div class="content">

      <h2>Wedding Gift</h2>

      <div class="gift-info">
        <p>Bank: Seabank</p>
        <p>Nomor rekening:</p>
        <p id="nomor-rekening">901168885116</p>
        <p>Atas nama: Anis Mufidah</p>

        <button class="gift-button" type="button"
          onclick="salinRekening()">
          Salin Nomor Rekening
        </button>

        <p id="status-salin" aria-live="polite"></p>
      </div>

    </div>

  </section>


  <!-- SECTION 8: PENUTUP - 8.mp4 -->
  <section class="page" id="penutup">

    <video class="bg-video" autoplay muted loop playsinline>
      <source src="8.mp4" type="video/mp4">
    </video>

    <div class="content">
      <h2></h2>
    </div>

  </section>


  <!-- MUSIK BACKGROUND -->
  <audio id="musik-latar" loop preload="none">
    <source src="music.mp3" type="audio/mpeg">
  </audio>


  <!-- NAVIGASI BAWAH -->
  <nav class="bottom-nav" aria-label="Navigasi undangan">

    <button class="nav-button" type="button"
      aria-label="Cover" onclick="keSection('cover')">
      <span class="nav-icon">⌂</span>
    </button>

    <button class="nav-button" type="button"
      aria-label="Lokasi acara"
      onclick="keSection('lokasi-countdown')">
      <span class="nav-icon">⌖</span>
    </button>

    <button class="nav-button" type="button"
      aria-label="Gift" onclick="keSection('gift')">
      <span class="nav-icon">♡</span>
    </button>

    <button class="nav-button" type="button"
      aria-label="Penutup" onclick="keSection('penutup')">
      <span class="nav-icon">×</span>
    </button>

  </nav>


  <!-- JAVASCRIPT -->
  <script>

    /* 1. BUKA UNDANGAN */
    function bukaUndangan() {

      document.body.classList.remove("cover-terkunci");

      keSection("section-2");

      const audio = document.getElementById("musik-latar");

      if (audio.paused) {
        audio.play()
          .then(perbaruiTombolMusik)
          .catch(perbaruiTombolMusik);
      }
    }


    /* 2. NAVIGASI SECTION */
    function keSection(id) {

      const section = document.getElementById(id);

      if (section) {
        section.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }


    /* 3. COUNTDOWN ACARA */
    const waktuAcara = new Date(
      "2026-12-08T09:00:00+07:00"
    ).getTime();

    function perbaruiCountdown() {

      const sisa = waktuAcara - Date.now();

      const hari = document.getElementById("hari");
      const jam = document.getElementById("jam");
      const menit = document.getElementById("menit");
      const detik = document.getElementById("detik");

      if (!hari || !jam || !menit || !detik) return;

      if (sisa <= 0) {
        hari.textContent = "0";
        jam.textContent = "00";
        menit.textContent = "00";
        detik.textContent = "00";
        return;
      }

      hari.textContent = Math.floor(
        sisa / (1000 * 60 * 60 * 24)
      );

      jam.textContent = String(
        Math.floor(
          (sisa % (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        )
      ).padStart(2, "0");

      menit.textContent = String(
        Math.floor(
          (sisa % (1000 * 60 * 60)) /
          (1000 * 60)
        )
      ).padStart(2, "0");

      detik.textContent = String(
        Math.floor(
          (sisa % (1000 * 60)) / 1000
        )
      ).padStart(2, "0");
    }

    perbaruiCountdown();
    setInterval(perbaruiCountdown, 1000);


    /* 4. MUSIK PLAY / PAUSE */
    const audioMusik = document.getElementById("musik-latar");

    function perbaruiTombolMusik() {

      const ikon = document.getElementById("ikon-musik");
      const tombol = document.getElementById("tombol-musik");

      if (audioMusik.paused) {
        ikon.textContent = "▶";
        tombol.setAttribute("aria-label", "Putar musik");
        tombol.setAttribute("aria-pressed", "false");
      } else {
        ikon.textContent = "Ⅱ";
        tombol.setAttribute("aria-label", "Jeda musik");
        tombol.setAttribute("aria-pressed", "true");
      }
    }

    async function toggleMusik() {

      try {
        if (audioMusik.paused) {
          await audioMusik.play();
        } else {
          audioMusik.pause();
        }
      } catch (error) {
        console.error("Musik tidak bisa diputar:", error);
      }

      perbaruiTombolMusik();
    }

    audioMusik.addEventListener("play", perbaruiTombolMusik);
    audioMusik.addEventListener("pause", perbaruiTombolMusik);


    /* 5. SALIN NOMOR REKENING */
    async function salinRekening() {

      const nomor = document.getElementById(
        "nomor-rekening"
      ).textContent.trim();

      const status = document.getElementById("status-salin");

      try {
        await navigator.clipboard.writeText(nomor);
        status.textContent = "Nomor rekening berhasil disalin.";
      } catch (error) {
        status.textContent =
          "Gagal menyalin otomatis. Silakan salin nomor secara manual.";
      }
    }


    /* 6. NAMA TAMU OTOMATIS DARI LINK */
    const parameterTamu = new URLSearchParams(
      window.location.search
    );

    const namaDariLink = parameterTamu.get("to");
    const elemenNamaTamu = document.getElementById("nama-tamu");

    if (elemenNamaTamu && namaDariLink && namaDariLink.trim() !== "") {
      elemenNamaTamu.textContent =
        decodeURIComponent(namaDariLink.replace(/\+/g, " ")).trim();
    } else if (elemenNamaTamu) {
      elemenNamaTamu.textContent = "Tamu Undangan";
    }


    /* 7. STATUS AWAL MUSIK */
    perbaruiTombolMusik();
const pengamatSection = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("muncul");
    } else {
      entry.target.classList.remove("muncul");
    }
  });
}, {
  threshold: 0.35
});

document.querySelectorAll(".page").forEach((section) => {
  pengamatSection.observe(section);
});

    /* 8. KUNCI SCROLL SEBELUM UNDANGAN DIBUKA */
    document.body.classList.add("cover-terkunci");

  </script>

</body>
</html>
